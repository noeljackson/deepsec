[[matcher]]
slug = "axum-handler"
description = "Axum route exposing an auth, credential, or proxy boundary"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)\\.route\\s*\\(\\s*\"/[^\"]*(?:admin|auth|secret|credential|token|proxy)[^\"]*\"\\s*,",
]
require_content = ["axum"]
snippet_after = 12
requires = { tech = ["axum"] }
label = "sensitive Axum route boundary"

[[matcher]]
slug = "actix-handler"
description = "Actix handler"
noise_tier = "noisy"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)#\\[(?:get|post|put|delete|patch)\\s*\\(\\s*\"/",
  "(?i)\\.route\\s*\\(\\s*\"/[^\"]*\"\\s*,\\s*web::(?:get|post|put|delete)",
]
require_content = ["actix"]
snippet_after = 12
requires = { tech = ["actix"] }
label = "Actix handler"

[[matcher]]
slug = "rust-unsafe-block"
description = "Unsafe block — manual audit warranted"
noise_tier = "noisy"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)\\bunsafe\\s*\\{",
]
snippet_after = 8
label = "unsafe block"
[[matcher.ast_patterns]]
language = "rust"
label = "unsafe block inside a function body"
primary_capture = "@block"
snippet_capture = "@block"
prefilter_patterns = ["\\bunsafe\\s*\\{"]
query = '''
(
  function_item
    body: (block
      (unsafe_block) @block)
) @fn
'''

[[matcher]]
slug = "rust-cmd-injection"
description = "std::process::Command with concatenated argv"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)Command::new\\s*\\([^)]*\\)\\s*\\.arg\\s*\\(\\s*&?format!",
  "(?i)\\.arg\\s*\\(\\s*&?req\\.",
]
label = "shell-style command built from input"
require_taint_within = 25

[[matcher]]
slug = "rust-mem-transmute"
description = "std::mem::transmute — unsoundness vector"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)\\bmem::transmute\\b",
  "(?i)\\bstd::mem::transmute\\b",
]
snippet_after = 8
label = "mem::transmute call"

[[matcher]]
slug = "rust-unsafe-raw-pointer-deref"
description = "Raw pointer dereference inside unsafe block"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)\\bunsafe\\s*\\{[^}]*\\*\\s*[a-z_][a-z0-9_]*",
]
snippet_after = 6
label = "raw pointer deref under unsafe"

[[matcher]]
slug = "rust-sqlx-query"
description = "sqlx::query with format! — SQL injection vector"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)sqlx::query(?:_as)?\\s*\\(\\s*&?format!",
  "(?i)sqlx::query(?:_as)?\\s*\\(\\s*&?String::from",
]
require_content = ["sqlx"]
snippet_after = 6
label = "sqlx query built via format!()"

[[matcher]]
slug = "rust-process-command-from-input"
description = "Command::new selects an executable from a non-literal value; this is argv execution, not shell injection"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)Command::new\\s*\\(\\s*&?[a-z_][a-z0-9_]*\\s*\\)",
  "(?i)Command::new\\s*\\(\\s*&?req\\.",
]
snippet_after = 6
label = "dynamic executable selection — verify allowlist, not shell quoting"

[[matcher]]
slug = "rust-child-process-inherits-credentials"
description = "Child receives an explicit environment map without clearing inherited credentials; inspect token and basic-auth leakage across the execution boundary"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?s)Command::new\\s*\\([^;]{0,960}?\\.envs\\s*\\(",
]
suppress_patterns = [
  "(?s)\\.env_(?:clear|remove)\\s*\\(",
]
snippet_before = 2
snippet_after = 20
label = "child environment inherits parent credentials unless explicitly cleared"

[[matcher]]
slug = "rust-shell-command-execution"
description = "Rust launches a shell interpreter; dynamic arguments can become shell injection"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)Command::new\\s*\\(\\s*[\"'](?:sh|bash|zsh|cmd(?:\\.exe)?|powershell(?:\\.exe)?)[\"']\\s*\\)\\s*\\.arg\\s*\\(\\s*[\"'](?:-c|/c|/command)[\"']",
]
snippet_after = 8
label = "shell interpreter launched via Command"

[[matcher]]
slug = "rust-jwt-validation-boundary"
description = "Rust JWT validation boundary; inspect issuer, audience, expiry, algorithms, and claims"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "\\bdecode\\s*::\\s*<[^>]+>\\s*\\(",
]
require_content = ["jsonwebtoken"]
snippet_before = 24
snippet_after = 12
label = "JWT decode/validation boundary"

[[matcher]]
slug = "rust-jwt-validation-disabled"
description = "Rust JWT validation explicitly disables expiry, audience, or not-before checks"
noise_tier = "precise"
file_patterns = ["**/*.rs"]
patterns = [
  "\\bvalidation\\.(?:validate_exp|validate_aud|validate_nbf)\\s*=\\s*false\\b",
  "\\bValidation::default\\s*\\(\\s*\\)",
]
require_content = ["jsonwebtoken"]
snippet_after = 8
label = "JWT validation check disabled/defaulted"

[[matcher]]
slug = "rust-jwt-untrusted-algorithm"
description = "Rust JWT validation accepts the unsigned none algorithm"
noise_tier = "precise"
file_patterns = ["**/*.rs"]
patterns = [
  "\\bAlgorithm::None\\b",
  "[\"']none[\"']\\s*\\.parse\\s*::<\\s*Algorithm",
]
require_content = ["jsonwebtoken"]
snippet_after = 8
label = "unsigned JWT algorithm accepted"

[[matcher]]
slug = "rust-jwks-refresh-boundary"
description = "Remote JWKS refresh boundary; inspect kid selection, cache, rotation, and request amplification controls"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "\\.json\\s*::\\s*<\\s*JwkSet\\s*>\\s*\\(",
]
