[[matcher]]
slug = "rust-proxy-credential-injection"
description = "Credential is injected into an outbound HTTP header; inspect route policy and response redaction"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "HeaderValue::from_str\\s*\\(\\s*&?format!\\s*\\([^\\n]*(?:secret|token|credential)",
  "\\.(?:bearer_auth|basic_auth)\\s*\\(\\s*(?:token|secret|credential)\\b",
]
require_content = ["reqwest"]
snippet_before = 16
snippet_after = 18
label = "credential injected into outbound request"

[[matcher]]
slug = "rust-proxy-request-boundary"
description = "Rust proxy forwards a variable method and target; inspect method/path/query/header enforcement"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "\\.request\\s*\\(\\s*(?:method|request_method)\\b\\s*,\\s*(?:target|url|uri)\\b",
]
require_content = ["reqwest"]
snippet_before = 24
snippet_after = 18
