name: Bench label-debt

on:
  schedule:
    # 09:00 UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true

      - name: build benchsec
        run: CGO_ENABLED=0 go build -o bin/benchsec ./cmd/benchsec

      - name: stale check
        id: stale
        continue-on-error: true
        run: |
          set -e
          if ./bin/benchsec stale > /tmp/stale.txt 2>&1; then
            echo "have_stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_stale=true" >> "$GITHUB_OUTPUT"
            cat /tmp/stale.txt
          fi

      - name: open / update issue
        if: steps.stale.outputs.have_stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Bench tasks past their answer-key \`review_due\`:"
            echo ""
            echo '```'
            cat /tmp/stale.txt
            echo '```'
            echo ""
            echo "Generated by \`.github/workflows/bench-staleness.yml\`. Per #90's disagreement protocol, do NOT auto-edit \`answer.yaml\` — open per-task review issues, the reviewer adjudicates, then a PR cites them."
          } > /tmp/issue-body.md
          existing=$(gh issue list --label bench-label-debt --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
          else
            gh issue create \
              --title "bench: label debt — tasks past review_due" \
              --label bench-label-debt \
              --body-file /tmp/issue-body.md
          fi
