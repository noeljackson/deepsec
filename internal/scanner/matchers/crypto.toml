[[matcher]]
slug = "insecure-crypto"
description = "Weak / broken cryptographic primitive"
noise_tier = "precise"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.py", "**/*.rb", "**/*.go", "**/*.java", "**/*.cs", "**/*.php"]
patterns = [
  "(?i)\\bcreateHash\\s*\\(\\s*['\"](?:md5|sha1)['\"]",
  "(?i)\\bhashlib\\.(?:md5|sha1)\\s*\\(",
  "(?i)\\bDigest::(?:MD5|SHA1)\\b",
  "(?i)\\bcrypto/(?:md5|sha1)\\b",
  "(?i)\\bMessageDigest\\.getInstance\\s*\\(\\s*['\"](?:MD5|SHA-1)['\"]",
  "(?i)\\bDES\\b|\\b3DES\\b|\\bRC4\\b|\\bBlowfish\\b",
  "(?i)\\bECB\\b",
]
label = "weak cryptographic primitive (MD5/SHA1/DES/ECB)"

[[matcher]]
slug = "algorithm-confusion"
description = "JWT verify with 'none' or unspecified algorithm"
noise_tier = "precise"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.py", "**/*.rb", "**/*.go"]
patterns = [
  "(?i)\\bjwt\\.verify\\s*\\([^)]*algorithms?\\s*:\\s*\\[?\\s*['\"]none['\"]",
  "(?i)\\bjwt\\.decode\\s*\\([^)]*verify\\s*:\\s*[Ff]alse",
  "(?i)\\bverify\\s*=\\s*False[^\\n]*jwt",
]
label = "JWT verified without algorithm pinning"

[[matcher]]
slug = "crypto-random-insecure"
description = "Cryptographic value generated via non-CSPRNG"
noise_tier = "normal"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.py", "**/*.rb"]
patterns = [
  "(?i)Math\\.random\\s*\\(\\s*\\)[^\\n]*(?:token|secret|key|nonce|password|otp)",
  "(?i)\\brandom\\.random\\s*\\(\\s*\\)[^\\n]*(?:token|secret|key|nonce|password)",
  "(?i)\\brand\\s*\\(\\s*\\)[^\\n]*(?:token|secret|key|nonce|password)",
]
label = "non-cryptographic RNG used for security-sensitive value"
