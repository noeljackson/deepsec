# Additional matchers — second tranche. Lower priority / narrower scope
# than the core pack but still high-value targets.

[[matcher]]
slug = "missing-csrf-protection"
description = "State-changing endpoint without obvious CSRF token check"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.py", "**/*.rb"]
patterns = [
  "(?i)\\bapp\\.(?:post|put|patch|delete)\\s*\\(",
  "(?i)\\brouter\\.(?:post|put|patch|delete)\\s*\\(",
]
suppress_patterns = ["(?i)csrf|csurf|sameSite|origin\\s+check"]
snippet_after = 20
label = "state-changing endpoint without visible CSRF check"

[[matcher]]
slug = "rce-deserialization"
description = "Untrusted deserialization in non-Python languages"
noise_tier = "precise"
file_patterns = ["**/*.java", "**/*.rb", "**/*.go", "**/*.php"]
patterns = [
  "(?i)ObjectInputStream\\b",
  "(?i)Marshal\\.load\\b",
  "(?i)YAML\\.load\\b",
  "(?i)unserialize\\s*\\(\\s*\\$",
  "(?i)gob\\.NewDecoder\\b",
]
label = "untrusted deserialization"

[[matcher]]
slug = "xxe-xml-parser"
description = "XML parser configured to resolve external entities"
noise_tier = "precise"
file_patterns = ["**/*.java", "**/*.py", "**/*.go", "**/*.cs", "**/*.php", "**/*.ts", "**/*.js"]
patterns = [
  "(?i)DocumentBuilderFactory\\.newInstance",
  "(?i)SAXParserFactory\\.newInstance",
  "(?i)etree\\.XMLParser\\s*\\(\\s*resolve_entities\\s*=\\s*True",
  "(?i)libxml_disable_entity_loader\\s*\\(\\s*false\\b",
]
suppress_patterns = ["(?i)setFeature\\s*\\([^)]*disallow-doctype-decl[^)]*true"]
label = "XML parser with external entity expansion"

[[matcher]]
slug = "ldap-injection"
description = "LDAP filter built from user input"
noise_tier = "normal"
file_patterns = ["**/*.java", "**/*.py", "**/*.ts", "**/*.js"]
patterns = [
  "(?i)\\bldap[^(]*\\.search\\s*\\([^)]*(?:req|request|input)\\.",
  "(?i)\\bnew\\s+SearchControls\\([^)]*(?:user|input)",
]
label = "LDAP filter built from user input"

[[matcher]]
slug = "regex-dos"
description = "User-supplied input compiled as regex"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.py"]
patterns = [
  "(?i)new\\s+RegExp\\s*\\(\\s*(?:req|body|params|query|input)\\.",
  "(?i)re\\.compile\\s*\\(\\s*request\\.",
]
label = "user input compiled as regex (ReDoS surface)"

[[matcher]]
slug = "prototype-pollution"
description = "Recursive merge / Object.assign chain reachable from user input"
noise_tier = "normal"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs"]
patterns = [
  "(?i)\\b(?:_\\.merge|merge|deepMerge|extend|defaultsDeep)\\s*\\([^,)]*,\\s*(?:req|body|params|query)",
  "(?i)Object\\.assign\\s*\\([^,)]*,\\s*(?:req|body|params|query)\\.",
]
label = "deep-merge into untrusted source — prototype pollution"

[[matcher]]
slug = "race-condition-toctou"
description = "Time-of-check/time-of-use file pattern (stat-then-open)"
noise_tier = "noisy"
file_patterns = ["**/*.go", "**/*.py", "**/*.rs", "**/*.c", "**/*.cpp"]
patterns = [
  "(?i)\\b(?:stat|lstat|access|exists)\\s*\\([^)]+\\)[^\\n]*\\n[^\\n]*\\b(?:open|read|write)\\s*\\(",
]
label = "stat/access followed by open — TOCTOU"

[[matcher]]
slug = "iam-permissions-wildcard"
description = "Cloud SDK call granting wildcard permissions"
noise_tier = "precise"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.py", "**/*.go"]
patterns = [
  "(?i)PolicyDocument\\s*=\\s*[^\\n]*Action\\s*:\\s*['\"]?\\*",
  "(?i)AssumeRolePolicyDocument[^\\n]*Action\\s*:\\s*['\"]?sts:AssumeRole",
]
label = "cloud SDK granting wildcard action"

[[matcher]]
slug = "weak-jwt-signing"
description = "JWT signed with HS256 + short / static secret"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.py", "**/*.go"]
patterns = [
  "(?i)jwt\\.sign\\s*\\([^)]*['\"](?:HS256|HS384|HS512)['\"]",
]
require_content = ["jsonwebtoken|jose|pyjwt|jwt-go"]
snippet_after = 4
label = "JWT signed with symmetric key"

[[matcher]]
slug = "http-only-cookie-missing"
description = "Cookie set without httpOnly / secure flags"
noise_tier = "normal"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.py", "**/*.rb", "**/*.go"]
patterns = [
  "(?i)\\b(?:res|response|ctx)\\.cookie\\s*\\(",
  "(?i)set_cookie\\s*\\(",
]
suppress_patterns = ["(?i)httpOnly\\s*:\\s*true|secure\\s*:\\s*true|HttpOnly|Secure"]
snippet_after = 10
label = "cookie set without HttpOnly/Secure"

[[matcher]]
slug = "missing-rate-limit"
description = "Public mutating endpoint without rate limit middleware"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs"]
patterns = [
  "(?i)\\bapp\\.(?:post|put|patch|delete)\\s*\\(",
]
suppress_patterns = ["(?i)rateLimit|rate_limit|limiter|throttle"]
snippet_after = 25
label = "mutating endpoint without rate-limit middleware"

[[matcher]]
slug = "next-bypass-middleware"
description = "Next.js matcher config that excludes whole API tree"
noise_tier = "precise"
file_patterns = ["**/middleware.{ts,js,mjs}"]
patterns = [
  "(?i)matcher\\s*:\\s*\\[?[^\\]]*['\"]/(?!api)",
  "(?i)config\\s*=\\s*\\{\\s*matcher\\s*:\\s*['\"]/(?!api)",
]
requires = { tech = ["nextjs"] }
label = "Next.js middleware excludes API tree"

[[matcher]]
slug = "django-csrf-exempt"
description = "@csrf_exempt on a mutating view"
noise_tier = "precise"
file_patterns = ["**/*.py"]
patterns = [
  "(?i)@csrf_exempt\\b",
  "(?i)csrf_exempt\\s*\\(",
]
requires = { tech = ["django"] }
label = "@csrf_exempt"

[[matcher]]
slug = "go-time-comparison"
description = "Constant-time comparison missing on secrets / signatures"
noise_tier = "noisy"
file_patterns = ["**/*.go"]
patterns = [
  "(?i)\\bif\\s+\\w+\\s*==\\s*(?:expected|signature|token|secret|hmac)\\b",
  "(?i)\\b(?:signature|token|secret)\\s*==\\s*\\w+",
]
suppress_patterns = ["(?i)subtle\\.ConstantTimeCompare"]
label = "Go non-constant-time comparison for secrets"

[[matcher]]
slug = "ts-non-null-assert-auth"
description = "TS non-null assertion (!) on user/session in security-sensitive flow"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx"]
patterns = [
  "(?i)\\b(?:user|session|currentUser|me)!\\.\\w",
]
label = "TypeScript non-null assertion on auth context"

[[matcher]]
slug = "log4j-jndi-pattern"
description = "Log4j JNDI lookup pattern present in logged user input"
noise_tier = "precise"
file_patterns = ["**/*.java"]
patterns = [
  "(?i)Logger\\.[a-z]+\\s*\\([^)]*(?:request|param|user|input)",
]
require_content = ["(?:log4j|slf4j)"]
label = "Log4j logger with user-controlled message"

[[matcher]]
slug = "wildcard-import-untrusted"
description = "Python __import__ with user-controlled module name"
noise_tier = "precise"
file_patterns = ["**/*.py"]
patterns = [
  "(?i)__import__\\s*\\(\\s*(?:request|input|args)",
  "(?i)importlib\\.import_module\\s*\\(\\s*(?:request|input|args)",
]
label = "dynamic Python import from user input"

[[matcher]]
slug = "ssti-template-render"
description = "Server-side template renderer fed user input as template"
noise_tier = "precise"
file_patterns = ["**/*.py", "**/*.js", "**/*.ts", "**/*.rb"]
patterns = [
  "(?i)Template\\s*\\(\\s*(?:request|body|params|input)",
  "(?i)render_template_string\\s*\\(\\s*(?:request|body|params|input)",
  "(?i)Liquid::Template\\.parse\\s*\\(\\s*params",
]
label = "user input rendered as template — SSTI"

[[matcher]]
slug = "no-input-validation-zod-skip"
description = "Zod schema parsed only conditionally on POST/PUT"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx"]
patterns = [
  "(?i)\\.safeParse\\s*\\([^)]*\\)\\.success\\s*\\?\\s*[^:]+:",
]
suppress_patterns = ["(?i)return\\s+(?:NextResponse|res)\\.json\\s*\\(\\s*\\{\\s*error"]
label = "Zod .safeParse with permissive fallthrough"

[[matcher]]
slug = "supabase-rls-bypass"
description = "Supabase service-role key used in client-reachable path"
noise_tier = "precise"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs"]
patterns = [
  "(?i)SUPABASE_SERVICE_ROLE_KEY",
  "(?i)createClient\\s*\\([^)]*service_role",
]
exclude_path_patterns = ["server-only", "api/admin"]
label = "Supabase service-role key in non-admin code path"

[[matcher]]
slug = "firebase-rules-open"
description = "Firestore / RTDB rule allowing all reads/writes"
noise_tier = "precise"
file_patterns = ["**/firestore.rules", "**/database.rules.json", "**/storage.rules"]
patterns = [
  "(?i)allow\\s+(?:read|write|create|update|delete)\\s*:\\s*if\\s+true",
  "(?i)\".(?:read|write)\"\\s*:\\s*\"true\"",
]
label = "Firebase rule allows all access"

[[matcher]]
slug = "s3-public-acl"
description = "S3 bucket / object set to public-read"
noise_tier = "precise"
file_patterns = ["**/*.tf", "**/*.ts", "**/*.js", "**/*.py"]
patterns = [
  "(?i)ACL\\s*=?\\s*\"?public-(?:read|read-write)",
  "(?i)acl\\s*:\\s*['\"]public-(?:read|read-write)",
]
label = "S3 ACL = public-read*"

[[matcher]]
slug = "iframe-no-sandbox"
description = "Programmatically created <iframe> without sandbox attribute"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.html"]
patterns = [
  "(?i)<iframe\\b(?![^>]*\\bsandbox\\b)[^>]*src",
  "(?i)\\.createElement\\s*\\(\\s*['\"]iframe['\"]\\s*\\)",
]
label = "iframe without sandbox attribute"

[[matcher]]
slug = "websocket-no-origin-check"
description = "WebSocket upgrade handler without origin validation"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.js", "**/*.mjs", "**/*.go", "**/*.py"]
patterns = [
  "(?i)new\\s+WebSocketServer\\s*\\(",
  "(?i)websocket\\.Upgrader\\s*\\{",
  "(?i)websockets\\.serve\\s*\\(",
]
suppress_patterns = ["(?i)CheckOrigin|verifyClient|origin\\s+check"]
snippet_after = 10
label = "WebSocket upgrade without origin validation"

[[matcher]]
slug = "graphql-introspection-prod"
description = "GraphQL introspection enabled unconditionally"
noise_tier = "normal"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.py"]
patterns = [
  "(?i)introspection\\s*:\\s*true",
  "(?i)graphiql\\s*:\\s*true",
]
label = "GraphQL introspection / GraphiQL enabled"

[[matcher]]
slug = "tls-skip-verification"
description = "TLS certificate verification disabled"
noise_tier = "precise"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.py", "**/*.go", "**/*.java", "**/*.rb"]
patterns = [
  "(?i)rejectUnauthorized\\s*:\\s*false",
  "(?i)verify\\s*=\\s*False[^\\n]*requests\\.",
  "(?i)InsecureSkipVerify\\s*:\\s*true",
  "(?i)SSL_VERIFY_NONE",
  "(?i)TrustManager\\b[^\\n]*\\{\\s*checkServerTrusted\\s*\\([^)]*\\)\\s*\\{\\s*\\}",
]
label = "TLS verification disabled"

[[matcher]]
slug = "django-debug-true-prod"
description = "Django DEBUG = True at module level"
noise_tier = "precise"
file_patterns = ["**/settings.py", "**/settings/*.py"]
patterns = [
  "(?im)^DEBUG\\s*=\\s*True\\s*$",
]
requires = { tech = ["django"] }
label = "Django DEBUG=True at module top-level"

[[matcher]]
slug = "raw-html-in-react"
description = "React component returns raw user input as JSX expression"
noise_tier = "noisy"
file_patterns = ["**/*.tsx", "**/*.jsx"]
patterns = [
  "(?i)\\{(?:html|raw|markup)Content\\}",
]
require_content = ["dangerouslySetInnerHTML"]
label = "React raw HTML content variable"
