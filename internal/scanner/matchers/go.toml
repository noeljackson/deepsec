[[matcher]]
slug = "go-http-handler"
description = "Go net/http handler"
noise_tier = "noisy"
file_patterns = ["**/*.go"]
patterns = [
  "(?i)\\bfunc\\s+\\w+\\s*\\(\\s*\\w+\\s+http\\.ResponseWriter\\s*,\\s*\\w+\\s+\\*http\\.Request",
  "(?i)\\bhttp\\.HandleFunc\\s*\\(",
]
snippet_after = 12
label = "Go http handler"
[[matcher.ast_patterns]]
language = "go"
label = "Go http handler with command sink"
primary_capture = "@function"
snippet_capture = "@function"
prefilter_patterns = ["\\bhttp\\.Request\\b", "\\bexec\\.Command"]
query = '''
(
  function_declaration
    parameters: (parameter_list
      (parameter_declaration
        type: (pointer_type
          (selector_expression
            operand: (identifier) @http_pkg
            field: (field_identifier) @request_type))))
    body: (block
      (expression_statement
        (call_expression
          function: (selector_expression
            operand: (identifier) @exec_pkg
            field: (field_identifier) @exec_method))))*) @function
(#eq? @http_pkg "http")
(#eq? @request_type "Request")
(#eq? @exec_pkg "exec")
(#match? @exec_method "^(Command|CommandContext)$")
'''

[[matcher]]
slug = "go-gin-route"
description = "Gin route binding"
noise_tier = "noisy"
file_patterns = ["**/*.go"]
patterns = [
  "(?i)\\b(?:r|router|engine)\\.(?:GET|POST|PUT|PATCH|DELETE|Any)\\s*\\(",
]
require_content = ["gin-gonic/gin"]
snippet_after = 12
requires = { tech = ["gin"] }
label = "Gin route"

[[matcher]]
slug = "go-echo-route"
description = "Echo route binding"
noise_tier = "noisy"
file_patterns = ["**/*.go"]
patterns = [
  "(?i)\\b(?:e|echo)\\.(?:GET|POST|PUT|PATCH|DELETE|Any)\\s*\\(",
]
require_content = ["labstack/echo"]
snippet_after = 12
requires = { tech = ["echo"] }
label = "Echo route"

[[matcher]]
slug = "go-sql-raw"
description = "database/sql query built with fmt.Sprintf or string concat"
noise_tier = "normal"
file_patterns = ["**/*.go"]
patterns = [
  "(?i)\\b(?:Query|Exec)(?:Context)?\\s*\\(\\s*[^,)]*fmt\\.Sprintf",
  "(?i)\\b(?:Query|Exec)(?:Context)?\\s*\\(\\s*[`\"][^`\"]*\\+",
]
label = "Go SQL built via Sprintf/concat"

[[matcher]]
slug = "go-command-injection"
description = "exec.Command with concatenated input"
noise_tier = "normal"
file_patterns = ["**/*.go"]
patterns = [
  "(?i)\\bexec\\.Command\\s*\\([^)]*\\+",
  "(?i)\\bexec\\.CommandContext\\s*\\([^)]*\\+",
]
label = "exec.Command with concatenated input"
[[matcher.ast_patterns]]
language = "go"
label = "exec.Command dynamic argument"
primary_capture = "@call"
snippet_capture = "@call"
prefilter_patterns = ["\\bexec\\.Command"]
query = '''
(
  call_expression
    function: (selector_expression
      operand: (identifier) @pkg
      field: (field_identifier) @method)
    arguments: (argument_list
      [
        (binary_expression) @dynamic_arg
        (identifier) @dynamic_arg
      ])
) @call
(#eq? @pkg "exec")
(#match? @method "^(Command|CommandContext)$")
'''

[[matcher]]
slug = "go-ssrf"
description = "http.Get with user-supplied URL"
noise_tier = "noisy"
file_patterns = ["**/*.go"]
patterns = [
  "(?i)\\bhttp\\.(?:Get|Post|NewRequest)\\s*\\([^)]*(?:r\\.URL|c\\.Param|c\\.Query|c\\.PostForm)",
]
label = "Go outbound HTTP from request input"
