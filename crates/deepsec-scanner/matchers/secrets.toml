[[matcher]]
slug = "secret-plaintext"
description = "Hardcoded secret / API key in source"
noise_tier = "precise"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.py", "**/*.rb", "**/*.go", "**/*.rs", "**/*.java", "**/*.cs", "**/*.php", "**/*.env*", "**/*.yaml", "**/*.yml"]
exclude_path_patterns = ["\\.(test|spec)\\.[jt]sx?$", "node_modules/", "\\.lock$"]
patterns = [
  "(?i)\\bsk-(?:proj-|live-|test-)?[A-Za-z0-9_-]{20,}",
  "(?i)\\bxox[abprs]-[A-Za-z0-9-]{10,}",
  "(?i)\\bgh[pousr]_[A-Za-z0-9]{36,}",
  "(?i)AKIA[0-9A-Z]{16}",
  "(?i)AIza[0-9A-Za-z_-]{35}",
  "(?i)\\beyJhbGciOi[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]+",
]
suppress_patterns = ["EXAMPLE|PLACEHOLDER|REPLACE_ME|YOUR_KEY"]
label = "hardcoded secret literal"

[[matcher]]
slug = "secret-in-log"
description = "Secret-bearing variable logged"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.py"]
patterns = [
  "(?i)(?:console\\.(?:log|error|warn)|logger\\.(?:info|debug|warn|error)|print)\\s*\\([^)]*(?:apiKey|api_key|secret|token|password|passwd|pwd|access_key|private_key)\\b",
]
label = "secret-bearing value logged"

[[matcher]]
slug = "weak-default-secret"
description = "Default / placeholder JWT secret or signing key"
noise_tier = "precise"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.py", "**/*.rb", "**/*.go"]
patterns = [
  "(?i)\\b(?:JWT_SECRET|SIGNING_KEY|SESSION_SECRET|COOKIE_SECRET)\\s*=\\s*['\"](?:secret|changeme|password|dev|development|123456|test)['\"]",
  "(?i)secret\\s*:\\s*['\"](?:secret|changeme|dev|test|password)['\"]",
]
label = "weak / placeholder signing secret"
