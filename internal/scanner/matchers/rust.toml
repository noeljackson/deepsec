snippet_before = 28
snippet_after = 8
label = "remote JWKS refresh"

[[matcher]]
slug = "rust-reqwest-dynamic-url"
description = "Reqwest sends a request to a variable URL; inspect origin allowlisting, redirects, and sensitive headers"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "\\.(?:get|post|put|delete|patch)\\s*\\(\\s*&?(?:url|uri|target|endpoint|request_url|requestUrl)\\b",
  "\\.request\\s*\\(\\s*[^,]+,\\s*&?(?:url|uri|target|endpoint|request_url|requestUrl)\\b",
]
require_content = ["reqwest"]
snippet_before = 16
snippet_after = 12
label = "Reqwest dynamic URL boundary"

[[matcher]]
slug = "rust-reqwest-ssrf"
description = "Reqwest request uses a request/query field directly as its URL"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "\\.(?:get|post|put|delete|patch)\\s*\\(\\s*(?:request|req|query|params)\\.[A-Za-z_][A-Za-z0-9_]*\\s*\\)",
]
require_content = ["reqwest"]
snippet_before = 12
snippet_after = 8
label = "Reqwest URL directly from request data"

[[matcher]]
slug = "rust-reqwest-client-boundary"
