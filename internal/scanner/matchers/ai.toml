[[matcher]]
slug = "agent-loop-no-cap"
description = "Agent / LLM call without maxSteps / maxTurns / stopWhen — DoS + cost-burn risk"
noise_tier = "normal"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs"]
exclude_path_patterns = ["\\.(test|spec)\\.[jt]sx?$", "\\.d\\.ts$", "node_modules/"]
patterns = [
  "(?i)\\b(?:streamText|generateText|generateObject|streamObject)\\s*\\(",
  "(?i)\\bawait\\s+query\\s*\\(",
  "(?i)\\bclaude\\.query\\s*\\(",
]
require_content = ["(?:from\\s+[\"']ai[\"']|from\\s+[\"']@ai-sdk/|@anthropic-ai/claude-agent-sdk|@openai/codex-sdk)"]
suppress_patterns = ["(?i)\\b(?:maxSteps|maxTurns|stopWhen|signal|abortSignal)\\s*:"]
snippet_after = 30
label = "agent/LLM call without maxSteps/maxTurns/stopWhen/signal"

[[matcher]]
slug = "agentic-untrusted-prompt-input"
description = "User-controlled string embedded directly in LLM prompt"
noise_tier = "normal"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.py"]
patterns = [
  "(?i)\\bprompt\\s*:\\s*[`\"'][^`\"']*\\$\\{[^}]*(?:req|request|input|body|params|query|user)",
  "(?i)\\bmessages\\s*:\\s*\\[[^\\]]*content\\s*:\\s*[`\"'][^`\"']*\\$\\{[^}]*(?:req|request|input|body|user)",
  "(?i)\\bf[\"'][^\"']*\\{(?:request|user_input|args)\\.",
]
require_content = ["(?:claude|openai|anthropic|llm|gpt-|ai-sdk)"]
snippet_after = 8
label = "untrusted input concatenated into LLM prompt"

[[matcher]]
slug = "mcp-tool-handler"
description = "MCP tool handler — input validation and authorization required"
noise_tier = "noisy"
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.py"]
patterns = [
  "(?i)\\bregister_tool\\s*\\(",
  "(?i)server\\.tool\\s*\\(\\s*[\"']",
  "(?i)@tool\\s*\\(",
]
require_content = ["(?:@modelcontextprotocol|mcp\\.server|mcp_server)"]
snippet_after = 20
label = "MCP tool handler"
