[workspace]
resolver = "2"
members = [
    "crates/deepsec-core",
    "crates/deepsec-scanner",
    "crates/deepsec-processor",
    "crates/deepsec-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/noeljackson/deepsec"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
fancy-regex = "0.13"
globset = "0.4"
ignore = "0.4"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
indexmap = { version = "2", features = ["serde"] }
fs-err = "3"
dirs = "5"
once_cell = "1"
colored = "2"
fastrand = "2"
rayon = "1"
similar = "2"
csv = "1"

deepsec-core = { path = "crates/deepsec-core" }
deepsec-scanner = { path = "crates/deepsec-scanner" }
deepsec-processor = { path = "crates/deepsec-processor" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
