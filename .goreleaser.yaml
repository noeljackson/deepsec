version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: deepsec
    main: ./cmd/deepsec
    binary: deepsec
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: deepsec
    formats: [tar.gz]
    name_template: 'deepsec_{{.Version}}_{{.Os}}_{{.Arch}}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{.Tag}}-next'

dockers:
  - image_templates:
      - 'ghcr.io/noeljackson/deepsec:{{ .Version }}-amd64'
      - 'ghcr.io/noeljackson/deepsec:latest-amd64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: amd64
    build_flag_templates:
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.title=deepsec'
      - '--label=org.opencontainers.image.description=AI-powered security scanner'
      - '--label=org.opencontainers.image.url=https://github.com/noeljackson/deepsec'
      - '--label=org.opencontainers.image.source=https://github.com/noeljackson/deepsec'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.licenses=Apache-2.0'
  - image_templates:
      - 'ghcr.io/noeljackson/deepsec:{{ .Version }}-arm64'
      - 'ghcr.io/noeljackson/deepsec:latest-arm64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: arm64
    build_flag_templates:
      - '--platform=linux/arm64'
      - '--label=org.opencontainers.image.title=deepsec'
      - '--label=org.opencontainers.image.description=AI-powered security scanner'
      - '--label=org.opencontainers.image.url=https://github.com/noeljackson/deepsec'
      - '--label=org.opencontainers.image.source=https://github.com/noeljackson/deepsec'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.licenses=Apache-2.0'

docker_manifests:
  - name_template: 'ghcr.io/noeljackson/deepsec:{{ .Version }}'
    image_templates:
      - 'ghcr.io/noeljackson/deepsec:{{ .Version }}-amd64'
      - 'ghcr.io/noeljackson/deepsec:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/noeljackson/deepsec:latest'
    image_templates:
      - 'ghcr.io/noeljackson/deepsec:latest-amd64'
      - 'ghcr.io/noeljackson/deepsec:latest-arm64'

brews:
  - name: deepsec
    repository:
      owner: noeljackson
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Formula
    homepage: 'https://github.com/noeljackson/deepsec'
    description: 'AI-powered security scanner — multi-language matchers + AST + AI investigation'
    license: 'Apache-2.0'
    commit_author:
      name: deepsec-release-bot
      email: release-bot@noeljackson.com
    install: |
      bin.install "deepsec"
    test: |
      system "#{bin}/deepsec", "--version"

nfpms:
  - id: deepsec
    package_name: deepsec
    vendor: 'noeljackson'
    homepage: 'https://github.com/noeljackson/deepsec'
    maintainer: 'Noel Jackson <release-bot@noeljackson.com>'
    description: 'AI-powered security scanner'
    license: 'Apache-2.0'
    formats:
      - deb
      - rpm
      - apk

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?:.*$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([^)]*\))?:.*$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: noeljackson
    name: deepsec
  draft: false
  prerelease: auto
