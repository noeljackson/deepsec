# Z.ai "Coding Plan" subscription via the Anthropic-compatible endpoint.
# Same ZAI_API_KEY as the `glm` profile, but billed against the flat-rate
# Coding Plan instead of the pay-as-you-go API wallet. Pricing intentionally
# omitted: usage is covered by the subscription, not metered per-token.
[providers.zai-coding]
kind = "anthropic"
base_url = "https://api.z.ai/api/anthropic"
api_key_env = "ZAI_API_KEY"
default_model = "glm-5.1"

[providers.zai-coding.caps]
tool_use = true
prompt_cache = "auto"
structured_output = "tool_use"


[providers.kimi]
kind = "openai-compatible"
base_url = "https://api.moonshot.ai/v1"
