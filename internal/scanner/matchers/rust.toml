[[matcher]]
slug = "rust-proxy-forwards-client-authorization"
description = "Proxy copies caller-provided Authorization to an upstream; this can cross an authority boundary"
noise_tier = "normal"
file_patterns = ["**/*.rs"]
patterns = [
  "(?i)\\.header\\s*\\(\\s*(?:AUTHORIZATION|header::AUTHORIZATION)\\s*,\\s*(?:incoming|client|request)_?(?:authorization|auth|token)\\b",
]
require_content = ["reqwest"]
snippet_before = 16
snippet_after = 12
label = "client Authorization forwarded to upstream"

[[matcher]]
