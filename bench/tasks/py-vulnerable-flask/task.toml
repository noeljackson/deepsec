# This is deliberately a source-only benchmark fixture: its Flask imports
# exercise source rules, not dependency resolution. Keeping a manifest here
# causes external SCA resolvers to fetch a synthetic graph and makes the
# strict suite depend on that resolver's availability.
dependency_manifest = "none (reviewed source-only fixture)"

[labels]
change_rule = "freeze"
