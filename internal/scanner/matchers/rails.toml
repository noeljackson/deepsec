[[matcher]]
slug = "rails-controller-action"
description = "Rails controller action"
noise_tier = "noisy"
file_patterns = ["**/app/controllers/**/*.rb"]
patterns = [
  "(?i)^\\s*def\\s+\\w+\\s*$",
]
snippet_after = 12
requires = { tech = ["rails"] }
label = "Rails controller action"

[[matcher]]
slug = "rails-mass-assignment"
description = "Strong-params bypass or `permit!`"
noise_tier = "precise"
file_patterns = ["**/*.rb"]
patterns = [
  "(?i)\\.permit!\\b",
  "(?i)params\\.require\\([^)]+\\)\\.permit\\([^)]*\\.\\.\\.\\)",
]
requires = { tech = ["rails"] }
label = "Rails permit! / mass-assignment"

[[matcher]]
slug = "rails-sql-raw"
description = "ActiveRecord raw SQL with interpolation"
noise_tier = "normal"
file_patterns = ["**/*.rb"]
patterns = [
  "(?i)\\.where\\s*\\(\\s*[\"'][^\"']*#\\{",
  "(?i)\\.find_by_sql\\s*\\(\\s*[\"'][^\"']*#\\{",
]
requires = { tech = ["rails"] }
label = "ActiveRecord raw SQL with interpolation"
